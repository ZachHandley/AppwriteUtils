# yaml-language-server: $schema=../.yaml_schemas/collection.schema.json
# Collection Definition: BulkDeleteTestCollection
name: BulkDeleteTestCollection
id: bulk_delete_test_collection
documentSecurity: false
enabled: true
permissions:
  - permission: read
    target: any
  - permission: create
    target: users
  - permission: update
    target: users
  - permission: delete
    target: users
attributes:
  - key: batchId
    type: string
    size: 50
    required: true
    array: false
    encrypt: false
  - key: recordNumber
    type: integer
    required: true
    array: false
  - key: testData
    type: string
    size: 500
    required: false
    array: false
    encrypt: false
  - key: createdBatch
    type: datetime
    required: true
    array: false
indexes:
  - key: batch_index
    type: key
    attributes:
      - batchId
  - key: record_index
    type: key
    attributes:
      - recordNumber
importDefs: []
